spring.application.name=fintrack-api

# Banco de Dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fintrack?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}